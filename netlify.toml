[build]
  command = "npx prisma generate && npm run quickbuild"
  publish = ".next"

[build.environment]
  SECRETS_SCAN_OMIT_PATHS = "AGENTS.md,README.md,USAGE.md,prisma/seed.ts,.netlify,.agents,.githooks,.opencode,opencode.json,tests,.agents/README.md,app/api/openapi,TODO.md,scripts/check-remote-db.ts,e2e,.github/workflows/playwright.yml,.env.example,lib/__tests__/sqlite.test.ts"

[template]
  required-extensions = ["prisma-postgres"]

# Improve caching for static assets
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=86400"
